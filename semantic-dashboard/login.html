<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ProductFlow - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top left,
                    #5f9598 0%,
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #061e29,
                    #1d546d
                );

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
        }

        .brand {
            text-align: center;
            color: white;
            margin-bottom: 22px;
        }

        .brand h1 {
            margin: 0;
            font-size: 32px;
            letter-spacing: 0.5px;
        }

        .brand p {
            margin: 8px 0 0;
            color: #d8eeee;
            font-size: 15px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.97);

            border-radius: 20px;

            padding: 35px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.25);

            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .login-card h2 {
            margin: 0 0 8px;

            color: #061e29;

            font-size: 28px;
        }

        .login-card .subtitle {
            margin: 0 0 28px;

            color: #60757d;

            font-size: 14px;

            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            color: #061e29;

            font-size: 14px;

            font-weight: bold;
        }

        .form-group input {
            width: 100%;

            height: 50px;

            padding: 0 14px;

            border: 1px solid #cbd9dc;

            border-radius: 10px;

            background: #f7f9f9;

            color: #061e29;

            font-size: 15px;

            outline: none;
        }

        .form-group input:focus {
            border-color: #5f9598;

            box-shadow:
                0 0 0 3px rgba(95, 149, 152, 0.2);
        }

        .login-button {
            width: 100%;

            height: 50px;

            border: none;

            border-radius: 10px;

            background: #1d546d;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .login-button:hover {
            background: #061e29;

            transform: translateY(-1px);

            box-shadow:
                0 8px 20px rgba(6, 30, 41, 0.2);
        }

        .login-button:focus {
            outline: 3px solid #5f9598;

            outline-offset: 3px;
        }

        .error-message {
            display: none;

            margin-bottom: 18px;

            padding: 12px;

            border-radius: 8px;

            background: #fff0ee;

            border: 1px solid #e2aaa4;

            color: #b42318;

            font-size: 14px;
        }

        .demo-box {
            margin-top: 22px;

            padding: 13px;

            border-radius: 10px;

            background: #eef5f5;

            border-left: 4px solid #5f9598;

            color: #49636b;

            font-size: 13px;

            line-height: 1.5;
        }

        .footer-text {
            text-align: center;

            margin-top: 20px;

            color: #d8eeee;

            font-size: 13px;
        }

        @media (max-width: 480px) {

            body {
                padding: 16px;
            }

            .login-card {
                padding: 25px 20px;
            }

            .brand h1 {
                font-size: 27px;
            }

            .login-card h2 {
                font-size: 24px;
            }
        }
    </style>
</head>


<body>

    <main class="login-container">

        <div class="brand">

            <h1>ProductFlow</h1>

            <p>
                Enterprise Product Management Dashboard
            </p>

        </div>


        <section
            class="login-card"
            aria-labelledby="login-title"
        >

            <h2 id="login-title">
                Welcome Back
            </h2>

            <p class="subtitle">
                Sign in to access your product management dashboard.
            </p>


            <div
                id="login-error"
                class="error-message"
                role="alert"
            ></div>


            <form id="login-form">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="admin@example.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Sign In
                </button>

            </form>


            <div class="demo-box">
                <strong>Demo Login</strong><br>
                Use any valid email address and a password
                containing at least 4 characters.
            </div>

        </section>


        <p class="footer-text">
            ProductFlow &copy; 2026
        </p>

    </main>


    <script>

        const loginForm =
            document.getElementById("login-form");

        const loginError =
            document.getElementById("login-error");


        loginForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                loginError.style.display = "none";

                loginError.textContent = "";


                if (!email || !password) {

                    loginError.textContent =
                        "Please enter your email and password.";

                    loginError.style.display = "block";

                    return;
                }


                if (
                    !email.includes("@") ||
                    password.length < 4
                ) {

                    loginError.textContent =
                        "Please enter a valid email and a password with at least 4 characters.";

                    loginError.style.display = "block";

                    return;
                }


                const user = {
                    name: "Admin User",
                    email: email,
                    authenticated: true,
                    loginTime: new Date().toISOString()
                };


                localStorage.setItem(
                    "productFlowUser",
                    JSON.stringify(user)
                );


                window.location.href = "index.html";
            }
        );

    </script>

</body>
</html>
